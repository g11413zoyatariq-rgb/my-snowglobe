<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>a pretty snowglobe that will help you feel better</title>
     <link rel="stylesheet" href="style.css" />
  </head>
  <body>
     <div class="snow-container">
  <div class="snowflake" style="--left: 9%; --speed: 4s; --delay: 0s;"></div>
  <div class="snowflake" style="--left: 25%; --speed: 7s; --delay: 2s;"></div>
  <div class="snowflake" style="--left: 50%; --speed: 4s; --delay: 1s;"></div>
  <div class="snowflake" style="--left: 75%; --speed: 6s; --delay: 1s;"></div>
  <div class="snowflake" style="--left: 90%; --speed: 5s; --delay: 3s;"></div>
</div>

     <header class="hero">
      <h1 class="balanced title">MY SWEET SNOWGLOBE</h1>
      <p class="tagline">have pleasure shaking it</p>
      <p class="tagline">watch the snow fall</p>
      <p class="tagline">sometimes all you need is a little magic</p>
      <p class="tagline">this is your moment</p>
    </header>
    <main>
      <section class="globe-card">
        <div class="globe" id="globe">
          <img class="scene" src="snowglobe.png" alt="a snowglobe" />
        </div>
          <button id="shake">shake the globe</button>
        <p class="message" id="message">press the button and see what settles</p>
        <button id="fortuneBtn">Get Fortune</button>
        <p id="displayMessage"></p>
      </section>
    </main>
    <footer>
      <p>made by me, in the snow</p>
      <p>it's a little magic</p>
      <p>you deserve it</p>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
